name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Jobs only read the repo unless they say otherwise.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - uses: pnpm/action-setup@v6
      - id: get-store-path
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT
      - uses: actions/cache@v6
        with:
          path: ${{ steps.get-store-path.outputs.STORE_PATH }}
          key: pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-
            pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
      - uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.next/cache
          key: nextjs-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            nextjs-
            nextjs-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Build
        run: pnpm build

  # Builds the image and smoke-tests it read-only, with no capabilities, on every
  # run. On pushes to main it also publishes ghcr.io/<repo>/blog as :<commit>
  # and :latest.
  image:
    name: Build, test and push the image
    needs: [check]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    concurrency:
      group: image-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - name: Image name and tag
        id: meta
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}/blog" >> "$GITHUB_OUTPUT"
          echo "rev=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - name: Build for the smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          pull: true
          load: true
          tags: smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: |
          docker run -d --name smoke -p 3000:3000 --read-only --cap-drop ALL \
            --security-opt no-new-privileges --tmpfs /tmp --tmpfs /app/.next/cache smoke
          for _ in $(seq 30); do curl -so /dev/null localhost:3000/ && break; sleep 1; done
          docker exec smoke nc -z 127.0.0.1 3000 # the healthcheck
          expect() {
            code=$(curl -so /dev/null -w '%{http_code}' "localhost:3000$2")
            echo "$2 -> $code"
            [ "$code" = "$1" ] || { docker logs smoke; exit 1; }
          }
          expect 200 /
          expect 200 /about
          expect 200 /posts/compile-openssl-and-curl-for-android
          expect 301 /resume
          expect 404 /posts/missing
          expect 200 "/_next/image?url=%2Fimages%2Fningbo.jpg&w=640&q=75"
      - if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: github.event_name == 'push'
        uses: docker/build-push-action@v7
        with:
          context: .
          pull: true
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.rev }}
            ${{ steps.meta.outputs.image }}:latest
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Keeps the newest 10 commit tags; untagged leftovers of earlier pushes are deleted.
      - if: github.event_name == 'push'
        uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
        with:
          package: ${{ github.event.repository.name }}/blog
          keep-n-tagged: 10
          exclude-tags: latest
          delete-untagged: true
